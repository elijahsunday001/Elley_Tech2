    <circle cx="296" cy="201" r="19" fill="#f2b705"/>
    <rect x="340" y="188" width="190" height="18" rx="9" fill="#fff" opacity=".95"/>
    <rect x="250" y="287" width="530" height="114" rx="28" fill="#eef5ff"/>
