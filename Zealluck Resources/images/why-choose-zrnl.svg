    <rect x="286" y="359" width="310" height="16" rx="8" fill="#607086" opacity=".45"/>
    <circle cx="704" cy="344" r="34" fill="url(#gold)"/>
    <path d="M688 344l11 12 24-27" fill="none" stroke="#0b3d91" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="250" y="435" width="245" height="144" rx="28" fill="#fff" stroke="#dce7ef" stroke-width="3"/>
    <rect x="535" y="435" width="245" height="144" rx="28" fill="#fff" stroke="#dce7ef" stroke-width="3"/>
    <rect x="250" y="613" width="530" height="118" rx="28" fill="#0b3d91"/>

    <circle cx="314" cy="503" r="34" fill="#f2b705" opacity=".2"/>
    <path d="M299 506h30m-15-17v34" stroke="#0b3d91" stroke-width="10" stroke-linecap="round"/>
    <rect x="370" y="479" width="86" height="16" rx="8" fill="#102033"/>
    <rect x="370" y="512" width="66" height="14" rx="7" fill="#607086" opacity=".5"/>

