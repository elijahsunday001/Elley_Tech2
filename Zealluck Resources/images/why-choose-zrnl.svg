<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Why choose ZRNL</title>
  <desc id="desc">Modern ZRNL finance illustration showing savings, wallet security, customer support, and business growth.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#155bc4"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd35c"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0b3d91" flood-opacity=".18"/>
    </filter>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0v58" fill="none" stroke="#dbe7f2" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" rx="36" fill="#f5f9fd"/>
  <rect width="1200" height="900" rx="36" fill="url(#grid)" opacity=".42"/>
  <circle cx="930" cy="120" r="178" fill="#f2b705" opacity=".18"/>
  <circle cx="190" cy="760" r="210" fill="#0b3d91" opacity=".10"/>

